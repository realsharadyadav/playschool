<body>
<div id="app">
  <header id="topbar">
    <div class="brand">PlaySchool</div>
    <div class="streak" id="streakBadge" title="Daily streak">🔥<b id="streakCount">0</b></div>
    <button id="settingsBtn" class="iconbtn" aria-label="Settings">⚙️</button>
  </header>

  <main id="feeds"></main>

  <nav id="tabbar">
    <button class="tab" data-section="python"><span class="ti">🐍</span><span class="tl">Python</span><i class="tp"><b></b></i></button>
    <button class="tab active" data-section="genai"><span class="ti">🧠</span><span class="tl">GenAI</span><i class="tp"><b></b></i></button>
    <button class="tab" data-section="agentic"><span class="ti">🤖</span><span class="tl">Agentic</span><i class="tp"><b></b></i></button>
  </nav>

  <div id="scrim"></div>

  <aside id="codePanel" class="sheet right">
    <div class="sheet-head"><span id="codeTitle" class="sheet-title"></span><button class="iconbtn close-sheet">✕</button></div>
    <div class="sheet-scroll">
      <pre id="codeBody" class="code"></pre>
      <div id="codeNotes" class="annotes"></div>
    </div>
  </aside>

  <section id="notesSheet" class="sheet bottom">
    <div class="grab"></div>
    <div class="sheet-head"><span id="notesTitle" class="sheet-title"></span><button class="iconbtn close-sheet">✕</button></div>
    <div id="notesBody" class="sheet-scroll notes-body"></div>
  </section>

  <section id="settingsSheet" class="sheet bottom">
    <div class="grab"></div>
    <div class="sheet-head"><span class="sheet-title">⚙️ Settings</span><button class="iconbtn close-sheet">✕</button></div>
    <div class="sheet-scroll set-body">
      <label class="set-row">🗣️ Voice
        <select id="voiceSel"></select>
        <button id="voiceTest" class="iconbtn" aria-label="Preview voice" title="Preview this voice">🔊</button>
      </label>
      <label class="set-row">⏩ Speed <b id="rateVal">1.05×</b>
        <input type="range" id="rateSel" min="0.8" max="1.6" step="0.05">
      </label>
      <label class="set-row">🎭 Expressiveness <b id="exprVal">60%</b>
        <input type="range" id="exprSel" min="0" max="1" step="0.05">
      </label>
      <label class="set-row">🔇 Mute narration
        <input type="checkbox" id="muteSel">
      </label>
      <button id="resetBtn" class="danger">🗑 Reset all progress</button>
      <p class="set-hint">Progress, likes &amp; streak live on this device only.<br>Full curriculum · 74 reels · zero dependencies 🚀</p>
    </div>
  </section>

  <div id="toast"></div>
</div>
